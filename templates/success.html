{% extends "base.html" %}
{% block content %}

<div class="container">
    <h1>Registration Successful 🎉</h1>
    <a href="/register">Register Another User</a>

    <h2>All Registered Users</h2>

    <table class="table table-bordered">
        <tr>
            <th>#</th>
            <th>Photo</th>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Action</th>
        </tr>

        {% for user in users %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>
                <img src="/static/uploads/{{ user.profile_pic }}" alt="Profile Pic" width="50" height="50"
                    class="rounded-circle">
            </td>
            <td>{{ user.id }}</td>
            <td>{{ user.name }}</td>
            <td>{{ user.age }}</td>
            <td>
                <a href="/update_user/{{ user.id }}" class="btn btn-outline-primary">Edit</a>
                <a href="/delete_user/{{ user.id }}" class="btn btn-outline-danger"
                    onclick="return confirm('Are you sure you want to delete this user?')">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>

</div>

{% endblock %}

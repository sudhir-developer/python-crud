{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h1>Register Form</h1>

            <form action="/register" method="post">
                <label>Name:</label>
                <input type="text" name="name" required>
                <br><br>

                <label>Age:</label>
                <input type="number" name="age" required>
                <br><br>

                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}

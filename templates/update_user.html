{% extends "base.html" %}
{% block content %}

<div class="container">
    <div class="col-md-4 mx-auto">
        <h1>Update User</h1>

        <form action="/update_user/{{ user.id }}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" name="name" class="form-control" value="{{ user.name }}" required>
            </div>

            <div class="mb-3">
                <label for="age" class="form-label">Age</label>
                <input type="number" id="age" name="age" class="form-control" value="{{ user.age }}" required>
            </div>
            <div class="mb-3">
                <label>Profile Picture</label>
                <input type="file" name="profile_pic" class="form-control">

                <p class="mt-2">Current Image:</p>
                <img src="/static/uploads/{{ user.profile_pic }}" width="80" height="80" class="rounded-circle">
            </div>

            <button type="submit" class="btn btn-primary">Update</button>
            <a href="/success" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
